<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Limerence</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root {
    --bg-primary: #FAF8F5;
    --bg-secondary: #F0ECF4;
    --text-primary: #2D1B3D;
    --text-secondary: #6B5B7B;
    --accent: #5C3D7A;
    --accent-light: #7B68AE;
    --accent-gold: #BFA16A;
    --border: #D8CDE0;
    --card-bg: #FFFFFF;
    --shadow: rgba(45, 27, 61, 0.08);
    --danger: #A94442;
  }

  [data-theme="dark"] {
    --bg-primary: #13101A;
    --bg-secondary: #1E1829;
    --text-primary: #EFEAED;
    --text-secondary: #9890A6;
    --accent: #A688C6;
    --accent-light: #C4A9E0;
    --accent-gold: #D4AF37;
    --border: #342A41;
    --card-bg: #251E30;
    --shadow: rgba(0, 0, 0, 0.3);
    --danger: #E06C75;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Serif SC', 'Cormorant Garamond', serif;
    background-color: var(--bg-primary);
    color: var(--text-primary);
    height: 100vh; overflow: hidden;
    transition: background-color 0.4s, color 0.4s;
  }

  /* 顶栏 */
  #top-bar {
    height: 50px; display: flex; justify-content: space-between; align-items: center;
    padding: 0 20px; background: var(--bg-secondary); border-bottom: 1px solid var(--border);
    position: relative; z-index: 100;
  }
  .top-btn {
    background: none; border: none; color: var(--text-secondary); font-size: 1.2rem;
    cursor: pointer; padding: 8px; transition: color 0.2s;
  }
  .top-btn:hover, .top-btn:active { color: var(--accent); }

  /* 视图容器 */
  .view { display: none; height: calc(100vh - 50px); overflow: hidden; }
  .view.active { display: flex; flex-direction: column; }

  /* =================== 主页样式 =================== */
  #home-slider {
    flex: 1; display: flex; align-items: center; overflow-x: auto; scrollbar-width: none;
  }
  #home-slider::-webkit-scrollbar { display: none; }
  .violet-screen {
    flex: 0 0 100vw; height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .violet-ascii {
    font-family: 'Cormorant Garamond', monospace; color: var(--accent); text-align: center;
    line-height: 1.2; font-size: 1.2rem; margin-bottom: 20px; white-space: pre; user-select: none;
  }
  .characters-scroll-area {
    flex: 0 0 auto; display: flex; align-items: center; height: 100%; padding: 0 30px; gap: 25px;
  }
  .char-card {
    width: 200px; height: 260px; background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 12px; padding: 25px 20px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; box-shadow: 0 4px 15px var(--shadow);
    cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
  }
  .char-card:active { transform: scale(0.97); }
  .avatar {
    width: 80px; height: 80px; border-radius: 50%; background: var(--bg-secondary);
    border: 2px solid var(--accent-light); margin-bottom: 15px; object-fit: cover;
    box-shadow: 0 2px 8px var(--shadow);
  }
  .char-name { font-weight: 600; color: var(--accent); margin-bottom: 5px; }
  .char-bio { font-size: 0.85rem; color: var(--text-secondary); text-align: center; line-height: 1.4; max-height: 50px; overflow: hidden; }
  .add-card { border: 2px dashed var(--border); background: transparent; box-shadow: none; color: var(--text-secondary); }
  .add-card:active { background: var(--bg-secondary); }
  #home-footer {
    height: 60px; display: flex; align-items: center; justify-content: center;
    background: var(--bg-secondary); border-top: 1px solid var(--border);
    font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 1.1rem;
    color: var(--text-secondary); padding: 0 20px;
  }
  #signature-input {
    background: none; border: none; border-bottom: 1px solid var(--border); color: var(--text-primary);
    text-align: center; font-family: inherit; font-style: inherit; font-size: inherit;
    width: 80%; outline: none; padding: 2px 0;
  }
  #signature-input:focus { border-bottom: 1px solid var(--accent); }

  /* =================== 详情页样式 =================== */
  #view-detail { background: var(--bg-primary); position: relative; }
  
  /* 详情头部：头像+名字 */
  .detail-header {
    display: flex; align-items: center; padding: 15px 20px; border-bottom: 1px solid var(--border);
    background: var(--bg-secondary);
  }
  .detail-header .avatar { width: 50px; height: 50px; margin-bottom: 0; margin-right: 15px; }
  .detail-name { font-size: 1.2rem; font-weight: 600; color: var(--accent); }

  /* 双栏布局 */
  .detail-body {
    flex: 1; display: flex; overflow: hidden; position: relative;
  }
  .panel-left, .panel-right {
    transition: flex 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s;
    overflow-y: auto; padding: 15px;
    scrollbar-width: none;
  }
  .panel-left::-webkit-scrollbar, .panel-right::-webkit-scrollbar { display: none; }
  
  /* 默认各占一半 */
  .panel-left { flex: 1; border-right: 1px solid var(--border); background: var(--bg-primary); }
  .panel-right { flex: 1; background: var(--bg-secondary); }

  /* 激活状态：左宽右窄 */
  .detail-body.focus-left .panel-left { flex: 2; }
  .detail-body.focus-left .panel-right { flex: 0.5; opacity: 0.6; }
  /* 激活状态：右宽左窄 */
  .detail-body.focus-right .panel-right { flex: 2; }
  .detail-body.focus-right .panel-left { flex: 0.5; opacity: 0.6; }

  /* 左栏菜单项 */
  .left-menu-item {
    display: flex; align-items: center; padding: 14px 15px; background: var(--card-bg);
    border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px;
    cursor: pointer; transition: background 0.2s, transform 0.1s;
    box-shadow: 0 2px 5px var(--shadow);
  }
  .left-menu-item:active { transform: scale(0.98); background: var(--bg-secondary); }
  .left-menu-item i { color: var(--accent); font-size: 1.1rem; width: 30px; text-align: center; margin-right: 10px; }
  .left-menu-item span { color: var(--text-primary); font-weight: 500; }
  .left-menu-item .arrow { margin-left: auto; color: var(--text-secondary); font-size: 0.8rem; }

  /* 右栏聊天窗口列表 */
  .right-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
  .right-header h3 { color: var(--accent); font-size: 1rem; }
  .chat-add-btn {
    background: var(--accent); color: #fff; border: none; width: 28px; height: 28px;
    border-radius: 50%; font-size: 1rem; cursor: pointer; display: flex; align-items: center;
    justify-content: center; box-shadow: 0 2px 6px var(--shadow);
  }
  .chat-item {
    display: flex; align-items: center; justify-content: space-between; padding: 12px;
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px;
    margin-bottom: 8px; box-shadow: 0 1px 4px var(--shadow);
  }
  .chat-item-name { font-weight: 500; cursor: pointer; color: var(--text-primary); flex: 1; }
  .chat-item-actions { display: flex; gap: 10px; }
  .chat-item-actions i { color: var(--text-secondary); cursor: pointer; font-size: 0.9rem; padding: 4px; }
  .chat-item-actions i:hover { color: var(--accent); }
  .chat-item-actions .fa-trash:hover { color: var(--danger); }

  /* =================== 子页面通用样式 (覆盖层) =================== */
  .subpage-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: var(--bg-primary); z-index: 50;
    transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex; flex-direction: column;
  }
  .subpage-overlay.active { transform: translateX(0); }
  
  .subpage-header {
    display: flex; align-items: center; padding: 15px 20px; border-bottom: 1px solid var(--border);
    background: var(--bg-secondary);
  }
  .subpage-header h3 { margin-left: 15px; color: var(--accent); font-weight: 600; }
  .subpage-body { flex: 1; overflow-y: auto; padding: 20px; }

  /* 表单元素 */
  .form-group { margin-bottom: 15px; }
  .form-group label { display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 5px; }
  .form-input {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--card-bg); color: var(--text-primary); font-family: inherit; font-size: 0.95rem;
    outline: none; transition: border-color 0.2s;
  }
  .form-input:focus { border-color: var(--accent); }
  textarea.form-input { min-height: 100px; resize: vertical; }
  
  .btn-primary {
    background: var(--accent); color: #fff; border: none; padding: 10px 20px;
    border-radius: 6px; font-family: inherit; font-size: 0.9rem; cursor: pointer;
    transition: background 0.2s; box-shadow: 0 2px 6px var(--shadow);
  }
  .btn-primary:active { background: var(--accent-light); }
  .btn-danger { background: var(--danger); }

  /* 条目/便签/记忆/信件列表 */
  .item-card {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 15px; margin-bottom: 10px; box-shadow: 0 1px 4px var(--shadow);
    position: relative;
  }
  .item-card-content { font-size: 0.9rem; line-height: 1.5; color: var(--text-primary); white-space: pre-wrap; }
  .item-card-meta { font-size: 0.75rem; color: var(--text-secondary); margin-top: 8px; }
  .item-card-actions { position: absolute; top: 10px; right: 10px; display: flex; gap: 8px; }
  .item-card-actions i { color: var(--text-secondary); cursor: pointer; font-size: 0.85rem; }
  .item-card-actions i:hover { color: var(--accent); }
  .item-card-actions .fa-trash:hover { color: var(--danger); }

  /* 便签划掉效果 */
  .item-card.done .item-card-content { text-decoration: line-through; color: var(--text-secondary); }

  /* 月份分类标题 */
  .month-divider { font-size: 0.9rem; color: var(--accent); font-weight: 600; margin: 15px 0 8px 0; border-bottom: 1px solid var(--border); padding-bottom: 4px; }

  /* 设置页 */
  #view-settings { background: var(--bg-primary); padding: 20px; overflow-y: auto; }
  .settings-header { display: flex; align-items: center; margin-bottom: 20px; }
  .settings-header h2 { margin-left: 15px; font-weight: 600; color: var(--accent); }
  .settings-section { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 15px; margin-bottom: 15px; }
  .settings-section h3 { font-size: 1rem; margin-bottom: 10px; color: var(--accent); }
</style>
</head>

<script>
  // ==========================================
  // 1. 数据库层
  // ==========================================
  const DB_NAME = 'LimerenceDB';
  const DB_VERSION = 1;
  let db = null;

  function openDB() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(DB_NAME, DB_VERSION);
      request.onupgradeneeded = (e) => {
        const db = e.target.result;
        ['characters', 'chats', 'memories', 'letters', 'notes', 'items', 'anniversaries', 'apiPresets'].forEach(name => {
          if (!db.objectStoreNames.contains(name)) db.createObjectStore(name, { keyPath: 'id' });
        });
      };
      request.onsuccess = (e) => { db = e.target.result; resolve(db); };
      request.onerror = (e) => reject(e);
    });
  }

  function dbPut(storeName, data) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(storeName, 'readwrite');
      tx.objectStore(storeName).put(data);
      tx.oncomplete = () => resolve();
      tx.onerror = (e) => reject(e);
    });
  }

  function dbGetAll(storeName) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(storeName, 'readonly');
      const req = tx.objectStore(storeName).getAll();
      req.onsuccess = () => resolve(req.result);
      req.onerror = (e) => reject(e);
    });
  }

  function dbDelete(storeName, id) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(storeName, 'readwrite');
      tx.objectStore(storeName).delete(id);
      tx.oncomplete = () => resolve();
      tx.onerror = (e) => reject(e);
    });
  }

  // ==========================================
  // 2. 状态管理
  // ==========================================
  let currentCharId = null; // 当前查看的角色ID

  // ==========================================
  // 3. 视图路由
  // ==========================================
  const views = ['view-home', 'view-settings', 'view-detail'];
  function switchView(viewId) {
    views.forEach(id => document.getElementById(id).classList.remove('active'));
    document.getElementById(viewId).classList.add('active');
  }

  // ==========================================
  // 4. 主题与基础交互
  // ==========================================
  const themeBtn = document.getElementById('btn-theme');
  function applyTheme(theme) {
    document.body.setAttribute('data-theme', theme);
    localStorage.setItem('limerence-theme', theme);
    themeBtn.innerHTML = theme === 'dark' ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
  }
  themeBtn.addEventListener('click', () => {
    applyTheme(document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });
  document.getElementById('btn-settings').addEventListener('click', () => switchView('view-settings'));
  document.getElementById('btn-back-home').addEventListener('click', () => switchView('view-home'));

  const signatureInput = document.getElementById('signature-input');
  signatureInput.addEventListener('blur', () => localStorage.setItem('limerence-signature', signatureInput.value));

  // ==========================================
  // 5. 主页逻辑
  // ==========================================
  document.getElementById('btn-add-char').addEventListener('click', async () => {
    const newChar = {
      id: 'char_' + Date.now(), name: '新角色', avatar: '',
      bio: '点击编辑简介...', systemPrompt: '', apiPresetId: 'default'
    };
    await dbPut('characters', newChar);
    loadCharacters();
  });

  async function loadCharacters() {
    const container = document.getElementById('char-container');
    const addBtn = document.getElementById('btn-add-char');
    container.querySelectorAll('.char-card:not(.add-card)').forEach(card => card.remove());
    const chars = await dbGetAll('characters');
    chars.forEach(char => {
      const card = document.createElement('div');
      card.className = 'char-card';
      card.setAttribute('data-id', char.id);
      card.innerHTML = `
        <div class="avatar" style="background-image:url(${char.avatar || ''}); background-size:cover; background-position:center;"></div>
        <div class="char-name">${char.name}</div>
        <div class="char-bio">${char.bio}</div>
      `;
      card.addEventListener('click', () => openDetail(char.id));
      container.insertBefore(card, addBtn);
    });
  }

  // ==========================================
  // 6. 详情页核心逻辑
  // ==========================================
  const detailBody = document.getElementById('detail-body');
  const panelLeft = document.getElementById('panel-left');
  const panelRight = document.getElementById('panel-right');

  // 打开详情页
  async function openDetail(charId) {
    currentCharId = charId;
    const chars = await dbGetAll('characters');
    const char = chars.find(c => c.id === charId);
    if (!char) return;

    // 渲染头部
    document.getElementById('detail-avatar').style.backgroundImage = `url(${char.avatar || ''})`;
    document.getElementById('detail-avatar').style.backgroundSize = 'cover';
    document.getElementById('detail-avatar').style.backgroundPosition = 'center';
    document.getElementById('detail-name').textContent = char.name;

    // 重置双栏状态
    detailBody.className = 'detail-body';

    // 加载子页面数据
    loadAboutData(char);
    loadChats();
    
    switchView('view-detail');
  }

  // 返回主页
  document.getElementById('btn-back-home-detail').addEventListener('click', () => {
    switchView('view-home');
    loadCharacters(); // 刷新主页卡片
  });

  // 左右栏焦点交互
  panelLeft.addEventListener('click', (e) => {
    // 如果点的是菜单项，打开子页面，不调整宽度
    if (e.target.closest('.left-menu-item')) return;
    detailBody.className = 'detail-body focus-left';
  });
  panelRight.addEventListener('click', (e) => {
    if (e.target.closest('.chat-item') || e.target.closest('.chat-add-btn')) return;
    detailBody.className = 'detail-body focus-right';
  });
  // 点击其他地方恢复平衡
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.panel-left') && !e.target.closest('.panel-right')) {
      if (document.getElementById('view-detail').classList.contains('active')) {
        detailBody.className = 'detail-body';
      }
    }
  });

  // ==========================================
  // 7. 子页面路由与通用逻辑
  // ==========================================
  const subpages = document.querySelectorAll('.subpage-overlay');
  
  // 打开子页面
  document.querySelectorAll('.left-menu-item').forEach(item => {
    item.addEventListener('click', () => {
      const subId = item.getAttribute('data-sub');
      openSubpage(subId);
    });
  });

  function openSubpage(subId) {
    const target = document.getElementById('sub-' + subId);
    if (target) {
      target.classList.add('active');
      // 加载对应数据
      if (subId === 'items') loadItems();
      if (subId === 'memory') loadMemories();
      if (subId === 'letters') loadLetters();
      if (subId === 'notes') loadNotes();
    }
  }

  // 关闭子页面
  document.querySelectorAll('.btn-close-sub').forEach(btn => {
    btn.addEventListener('click', () => {
      subpages.forEach(sub => sub.classList.remove('active'));
    });
  });

  // ==========================================
  // 8. 关于 & 简介逻辑
  // ==========================================
  function loadAboutData(char) {
    document.getElementById('input-bio').value = char.bio || '';
    document.getElementById('input-avatar-url').value = char.avatar || '';
    document.getElementById('input-char-name').value = char.name || '';
    document.getElementById('input-sys-prompt').value = char.systemPrompt || '';
  }

  // 保存简介
  document.getElementById('btn-save-bio').addEventListener('click', async () => {
    const chars = await dbGetAll('characters');
    const char = chars.find(c => c.id === currentCharId);
    if (char) {
      char.bio = document.getElementById('input-bio').value;
      await dbPut('characters', char);
      alert('简介已保存');
      // 关闭子页面
      document.getElementById('sub-bio').classList.remove('active');
    }
  });

  // 保存关于
  document.getElementById('btn-save-about').addEventListener('click', async () => {
    const chars = await dbGetAll('characters');
    const char = chars.find(c => c.id === currentCharId);
    if (char) {
      char.avatar = document.getElementById('input-avatar-url').value;
      char.name = document.getElementById('input-char-name').value;
      char.systemPrompt = document.getElementById('input-sys-prompt').value;
      await dbPut('characters', char);
      // 更新详情页头部
      document.getElementById('detail-avatar').style.backgroundImage = `url(${char.avatar})`;
      document.getElementById('detail-name').textContent = char.name;
      alert('设置已保存');
      document.getElementById('sub-about').classList.remove('active');
    }
  });

  // ==========================================
  // 9. 条目逻辑 (Items)
  // ==========================================
  document.getElementById('btn-add-item').addEventListener('click', async () => {
    const input = document.getElementById('input-new-item');
    const text = input.value.trim();
    if (!text) return;
    await dbPut('items', {
      id: 'item_' + Date.now(), characterId: currentCharId,
      content: text, createdAt: new Date().toISOString()
    });
    input.value = '';
    loadItems();
  });

  async function loadItems() {
    const list = document.getElementById('items-list');
    list.innerHTML = '';
    const items = (await dbGetAll('items')).filter(i => i.characterId === currentCharId);
    items.forEach(item => {
      list.innerHTML += `
        <div class="item-card">
          <div class="item-card-actions">
            <i class="fas fa-trash" onclick="deleteItem('${item.id}')"></i>
          </div>
          <div class="item-card-content">${item.content}</div>
          <div class="item-card-meta">${new Date(item.createdAt).toLocaleString()}</div>
        </div>
      `;
    });
  }
  window.deleteItem = async (id) => { await dbDelete('items', id); loadItems(); };

  // ==========================================
  // 10. 记忆库逻辑 (Memories) - 按月分类
  // ==========================================
  document.getElementById('btn-add-memory').addEventListener('click', async () => {
    const input = document.getElementById('input-new-memory');
    const text = input.value.trim();
    if (!text) return;
    const now = new Date();
    await dbPut('memories', {
      id: 'mem_' + Date.now(), characterId: currentCharId,
      content: text, date: now.toISOString(), month: `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`
    });
    input.value = '';
    loadMemories();
  });

  async function loadMemories() {
    const list = document.getElementById('memory-list');
    list.innerHTML = '';
    const mems = (await dbGetAll('memories')).filter(m => m.characterId === currentCharId);
    // 按月份分组
    const months = {};
    mems.forEach(m => {
      const key = m.month || '未知月份';
      if (!months[key]) months[key] = [];
      months[key].push(m);
    });
    // 降序排列月份
    Object.keys(months).sort().reverse().forEach(month => {
      list.innerHTML += `<div class="month-divider"><i class="fas fa-calendar-alt"></i> ${month}</div>`;
      months[month].forEach(m => {
        list.innerHTML += `
          <div class="item-card">
            <div class="item-card-actions">
              <i class="fas fa-trash" onclick="deleteMemory('${m.id}')"></i>
            </div>
            <div class="item-card-content">${m.content}</div>
            <div class="item-card-meta">${new Date(m.date).toLocaleString()}</div>
          </div>
        `;
      });
    });
  }
  window.deleteMemory = async (id) => { await dbDelete('memories', id); loadMemories(); };

  // ==========================================
  // 11. 信件逻辑 (Letters)
  // ==========================================
  document.getElementById('btn-write-letter').addEventListener('click', () => {
    document.getElementById('letter-compose').style.display = document.getElementById('letter-compose').style.display === 'none' ? 'block' : 'none';
  });

  document.getElementById('btn-send-letter').addEventListener('click', async () => {
    const title = document.getElementById('input-letter-title').value.trim();
    const content = document.getElementById('input-letter-content').value.trim();
    if (!content) return;
    await dbPut('letters', {
      id: 'let_' + Date.now(), characterId: currentCharId,
      title: title || '无题', content: content, fromUser: true,
      readByAI: false, createdAt: new Date().toISOString()
    });
    document.getElementById('input-letter-title').value = '';
    document.getElementById('input-letter-content').value = '';
    document.getElementById('letter-compose').style.display = 'none';
    loadLetters();
  });

  async function loadLetters() {
    const list = document.getElementById('letters-list');
    list.innerHTML = '';
    const lets = (await dbGetAll('letters')).filter(l => l.characterId === currentCharId);
    lets.forEach(l => {
      const fromTag = l.fromUser ? '<span style="color:var(--accent-gold);">来自你</span>' : '<span style="color:var(--accent-light);">来自AI</span>';
      list.innerHTML += `
        <div class="item-card">
          <div class="item-card-actions">
            <i class="fas fa-trash" onclick="deleteLetter('${l.id}')"></i>
          </div>
          <div style="font-weight:600; margin-bottom:5px;">${l.title} ${fromTag}</div>
          <div class="item-card-content">${l.content}</div>
          <div class="item-card-meta">${new Date(l.createdAt).toLocaleString()}</div>
        </div>
      `;
    });
  }
  window.deleteLetter = async (id) => { await dbDelete('letters', id); loadLetters(); };

  // ==========================================
  // 12. 便签逻辑 (Notes) - 带划掉功能
  // ==========================================
  document.getElementById('btn-add-note').addEventListener('click', async () => {
    const input = document.getElementById('input-new-note');
    const text = input.value.trim();
    if (!text) return;
    await dbPut('notes', {
      id: 'note_' + Date.now(), characterId: currentCharId,
      content: text, done: false, createdAt: new Date().toISOString()
    });
    input.value = '';
    loadNotes();
  });

  async function loadNotes() {
    const list = document.getElementById('notes-list');
    list.innerHTML = '';
    const notes = (await dbGetAll('notes')).filter(n => n.characterId === currentCharId);
    notes.forEach(n => {
      list.innerHTML += `
        <div class="item-card ${n.done ? 'done' : ''}">
          <div class="item-card-actions">
            <i class="fas ${n.done ? 'fa-undo' : 'fa-check'}" onclick="toggleNote('${n.id}')" title="${n.done ? '恢复' : '划掉'}"></i>
            <i class="fas fa-trash" onclick="deleteNote('${n.id}')"></i>
          </div>
          <div class="item-card-content">${n.content}</div>
          <div class="item-card-meta">${n.done ? '✓ 已完成' : '待完成'} · ${new Date(n.createdAt).toLocaleString()}</div>
        </div>
      `;
    });
  }
  window.toggleNote = async (id) => {
    const notes = await dbGetAll('notes');
    const note = notes.find(n => n.id === id);
    if (note) { note.done = !note.done; await dbPut('notes', note); loadNotes(); }
  };
  window.deleteNote = async (id) => { await dbDelete('notes', id); loadNotes(); };

  // ==========================================
  // 13. 右栏：聊天窗口管理
  // ==========================================
  document.getElementById('btn-add-chat').addEventListener('click', async () => {
    const chatName = prompt('为新聊天命名：', '新的对话');
    if (!chatName) return;
    await dbPut('chats', {
      id: 'chat_' + Date.now(), characterId: currentCharId,
      name: chatName, messages: [], createdAt: new Date().toISOString()
    });
    loadChats();
  });

  async function loadChats() {
    const list = document.getElementById('chat-list');
    list.innerHTML = '';
    const chats = (await dbGetAll('chats')).filter(c => c.characterId === currentCharId);
    chats.forEach(c => {
      list.innerHTML += `
        <div class="chat-item">
          <span class="chat-item-name" onclick="enterChat('${c.id}')">${c.name}</span>
          <div class="chat-item-actions">
            <i class="fas fa-pen" onclick="renameChat('${c.id}')" title="重命名"></i>
            <i class="fas fa-trash" onclick="deleteChat('${c.id}')" title="删除"></i>
          </div>
        </div>
      `;
    });
  }
  window.renameChat = async (id) => {
    const chats = await dbGetAll('chats');
    const chat = chats.find(c => c.id === id);
    if (chat) {
      const newName = prompt('重命名聊天：', chat.name);
      if (newName) { chat.name = newName; await dbPut('chats', chat); loadChats(); }
    }
  };
  window.deleteChat = async (id) => { await dbDelete('chats', id); loadChats(); };
  window.enterChat = (id) => {
    alert(`进入聊天 ${id}（聊天界面下个版本补充）`);
  };

  // ==========================================
  // 初始化
  // ==========================================
  async function init() {
    await openDB();
    applyTheme(localStorage.getItem('limerence-theme') || 'light');
    const savedSig = localStorage.getItem('limerence-signature');
    if (savedSig) signatureInput.value = savedSig;
    await loadCharacters();
  }
  init();
</script>
</body>
</html>
